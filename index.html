<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oaths & Ashes — Phase 3 Integration</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: linear-gradient(135deg, #1e1e2e 0%, #2a2a3a 100%);
        color: #e0e0e0;
        line-height: 1.6;
      }

      #root {
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      h1 {
        text-align: center;
        margin-bottom: 30px;
        color: #ffd700;
        text-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
      }

      .section {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 215, 0, 0.2);
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 20px;
        backdrop-filter: blur(10px);
      }

      .section h2 {
        color: #ffd700;
        margin-bottom: 15px;
        font-size: 18px;
      }

      button {
        background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
        color: #1e1e2e;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        transition: all 0.3s ease;
        margin: 5px 5px 5px 0;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      .status {
        padding: 10px;
        border-radius: 4px;
        margin: 10px 0;
        font-size: 14px;
      }

      .status.success {
        background: rgba(76, 175, 80, 0.2);
        border: 1px solid #4caf50;
        color: #81c784;
      }

      .status.error {
        background: rgba(244, 67, 54, 0.2);
        border: 1px solid #f44336;
        color: #ef5350;
      }

      .status.pending {
        background: rgba(33, 150, 243, 0.2);
        border: 1px solid #2196f3;
        color: #64b5f6;
      }

      .status.warning {
        background: rgba(255, 152, 0, 0.2);
        border: 1px solid #ff9800;
        color: #ffb74d;
      }

      .info-box {
        background: rgba(33, 150, 243, 0.1);
        border-left: 4px solid #2196f3;
        padding: 10px;
        margin: 10px 0;
        border-radius: 4px;
        font-size: 13px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        margin-top: 15px;
      }

      .house-selector {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin: 15px 0;
      }

      .house-option {
        padding: 12px;
        border: 2px solid rgba(255, 215, 0, 0.3);
        border-radius: 4px;
        cursor: pointer;
        text-align: center;
        transition: all 0.3s ease;
      }

      .house-option:hover {
        border-color: #ffd700;
        background: rgba(255, 215, 0, 0.1);
      }

      .house-option.selected {
        background: rgba(255, 215, 0, 0.2);
        border-color: #ffd700;
      }

      .address-display {
        font-family: monospace;
        word-break: break-all;
        font-size: 12px;
        background: rgba(0, 0, 0, 0.3);
        padding: 8px;
        border-radius: 4px;
        margin: 8px 0;
      }

      .event-list {
        max-height: 400px;
        overflow-y: auto;
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 215, 0, 0.2);
        border-radius: 4px;
        padding: 10px;
        margin-top: 10px;
      }

      .event-item {
        padding: 8px;
        border-bottom: 1px solid rgba(255, 215, 0, 0.1);
        font-size: 12px;
        font-family: monospace;
      }

      .event-item:last-child {
        border-bottom: none;
      }

      .tabs {
        display: flex;
        gap: 5px;
        margin-bottom: 15px;
        border-bottom: 1px solid rgba(255, 215, 0, 0.2);
      }

      .tab-button {
        background: transparent;
        border: none;
        padding: 10px 15px;
        color: #e0e0e0;
        cursor: pointer;
        border-bottom: 2px solid transparent;
        margin: 0;
        transition: all 0.3s ease;
      }

      .tab-button.active {
        color: #ffd700;
        border-bottom-color: #ffd700;
      }

      .tab-content {
        display: none;
      }

      .tab-content.active {
        display: block;
      }

      .action-selector {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
        margin: 15px 0;
      }

      .action-button {
        padding: 12px;
        background: rgba(255, 215, 0, 0.15);
        border: 2px solid rgba(255, 215, 0, 0.3);
        color: #ffd700;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .action-button:hover {
        background: rgba(255, 215, 0, 0.25);
        border-color: #ffd700;
      }

      .action-button.selected {
        background: rgba(255, 215, 0, 0.4);
        border-color: #ffd700;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
